name: Almanax du mois suivant

on:
  schedule:
    # Le 25 de chaque mois à 16:00 UTC (18h en été, 17h en hiver à Paris)
    - cron: "0 16 25 * *"
  workflow_dispatch:   # bouton "Run workflow" pour lancer à la main
    inputs:
      date_debut:
        description: "Date de début (AAAA-MM-JJ). Vide = mois suivant complet"
        required: false
        default: ""
      date_fin:
        description: "Date de fin (AAAA-MM-JJ). Vide = fin du mois de la date de début"
        required: false
        default: ""

permissions:
  contents: write      # pour enregistrer la page générée dans docs/

concurrency:
  group: almanax
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer la page
        env:
          DATE_DEBUT: ${{ inputs.date_debut }}
          DATE_FIN: ${{ inputs.date_fin }}
        run: python almanax_discord.py $DATE_DEBUT $DATE_FIN --dry-run

      - name: Publier la page (GitHub Pages lit le dossier docs/)
        run: |
          git config user.name "almanax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Page inchangée"
          else
            git commit -m "Page Almanax ${DATE_DEBUT:-mois suivant}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
        env:
          DATE_DEBUT: ${{ inputs.date_debut }}

      - name: Laisser GitHub Pages se mettre à jour
        run: sleep 60

      - name: Envoyer le message Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE_DEBUT: ${{ inputs.date_debut }}
          DATE_FIN: ${{ inputs.date_fin }}
        run: python almanax_discord.py $DATE_DEBUT $DATE_FIN
